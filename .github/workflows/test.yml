name: Emulator tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # the suite takes well under a minute; this stops a hang
    env:
      BANGLE_DIR: ${{ github.workspace }}/../bangle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh tests/setup-emulator.sh
      - run: npm test
      # The phone app's ports of beeplog.js and lib.js's tables
      # (android/src/beeplog.rs, src/tables.rs) are tested against files
      # made from them (tests/fixtures/beeplog/, tests/fixtures/tables.json):
      # they must be what they make now, or a change here leaves a port
      # behind with every check green. A changed fixture runs the phone
      # app's tests (android.yml), which then fail until the port keeps up.
      - name: The beeplog.js and lib.js fixtures are up to date
        run: |
          node tests/fixtures/beeplog/make.js
          git add -N tests/fixtures/beeplog tests/fixtures/tables.json
          git diff --exit-code --stat tests/fixtures/beeplog tests/fixtures/tables.json || {
            echo "::error::beeplog.js or lib.js's tables changed: run node tests/fixtures/beeplog/make.js, commit what it writes, and port the change (cd android && cargo test --test beeplog --test tables)"
            exit 1
          }
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: beeptest-install
          path: dist/beeptest-install.js
  store-check:
    # The checks the official app store (espruino/BangleApps) runs on a PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh tools/store-check.sh "$RUNNER_TEMP/BangleApps"
