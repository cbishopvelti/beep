name: Emulator tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # the suite takes well under a minute; this stops a hang
    env:
      BANGLE_DIR: ${{ github.workspace }}/../bangle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh tests/setup-emulator.sh
      - run: npm test
      # The phone app's port of beeplog.js (android/src/beeplog.rs) is
      # tested against files beeplog.js made: they must be what it makes
      # now, or a change here leaves the port behind with every check green.
      - name: The beeplog.js fixtures are up to date
        run: |
          node tests/fixtures/beeplog/make.js
          git add -N tests/fixtures/beeplog
          git diff --exit-code --stat tests/fixtures/beeplog || {
            echo "::error::beeplog.js or lib.js changed: run node tests/fixtures/beeplog/make.js, then cd android && cargo test"
            exit 1
          }
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: beeptest-install
          path: dist/beeptest-install.js
  store-check:
    # The checks the official app store (espruino/BangleApps) runs on a PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh tools/store-check.sh "$RUNNER_TEMP/BangleApps"
