[package]
name = "beep-android"
description = "Beep Test's Android app: an egui UI that keeps the phone and the watch in sync."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
# cdylib is the .so the Android NativeActivity loads; rlib lets the desktop
# binary and the tests use the same code.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "beep-desktop"
path = "src/bin/desktop.rs"

[dependencies]
serde_json = "1"
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
log = "0.4"
# localtime_r, for times shown in the phone's time zone.
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
android_logger = "0.15"
winit = { version = "0.30", features = ["android-native-activity"] }
# Calls into the Android platform (the Gadgetbridge broadcast, the share
# sheet, the direct link's Bluetooth).
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
env_logger = { version = "0.11", default-features = false }

[dev-dependencies]
tempfile = "3"
# Clicks through the pages headlessly (no wgpu, no snapshots).
egui_kittest = { version = "0.33", features = ["eframe"] }

[profile.release]
lto = "thin"
strip = true
