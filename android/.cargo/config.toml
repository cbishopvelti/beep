# Google Play takes only native libraries laid out for 16 KB memory pages
# (https://developer.android.com/guide/practices/page-sizes). NDK r28 and
# cargo-ndk 4 do that by themselves; this makes it so with older ones too.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]
